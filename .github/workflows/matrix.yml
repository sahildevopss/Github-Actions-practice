name: matrix builds

on:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false


      matrix:
        os:
          - ubuntu-latest
          - windows-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        exclude:
          - os: windows-latest
            python-version: "3.10"


    steps:
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: python --version

      - name: test failure
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        run: exit 1

      
