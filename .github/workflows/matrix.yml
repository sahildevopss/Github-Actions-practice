name: matrix builds

on:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"


    steps:
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Print Python version
        run: python --version
